name = "finpilot-ai"
main = "index.js"
compatibility_date = "2024-11-01"

# Variáveis NÃO sensíveis (podem ficar neste arquivo). Escolha o provedor:
# "anthropic" (padrão se você remover a linha) ou "gemini".
[vars]
AI_PROVIDER = "anthropic"
# GEMINI_MODEL = "gemini-2.5-flash-lite"   # descomente pra fixar um modelo do Gemini;
                                            # confira o nome atual em ai.google.dev antes de trocar

# Segredos: NUNCA vão neste arquivo. Configure depois do primeiro deploy,
# via terminal (o valor não fica salvo em nenhum lugar do repositório):
#
#   Se AI_PROVIDER = "anthropic":
#     wrangler secret put ANTHROPIC_API_KEY
#
#   Se AI_PROVIDER = "gemini":
#     wrangler secret put GEMINI_API_KEY
#
#   Recomendado nos dois casos (senha própria do app, evita que outra
#   pessoa gaste sua cota se descobrir a URL do Worker):
#     wrangler secret put APP_ACCESS_KEY
